<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invmatics logo concepts</title>
<style>
:root{--g:#059669;--navy:#0F172A;--ink:#111827;--mut:#6B7280;--line:#E5E7EB;--bg:#F8FAFB}
*{box-sizing:border-box;margin:0}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);padding:32px 20px 60px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:26px;letter-spacing:-.5px}.sub{color:var(--mut);margin:6px 0 28px;font-size:14px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:36px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.card h3{font-size:15px;margin-bottom:2px}.card p{font-size:12.5px;color:var(--mut);margin-bottom:16px;min-height:34px}
.row{display:flex;align-items:center;gap:14px}
.tile{width:96px;height:96px;border-radius:22px;background:var(--g);display:grid;place-items:center}
.tile.navy{background:var(--navy)}
.tile svg{width:64px;height:64px}
.small{display:flex;flex-direction:column;gap:10px;align-items:center}
.small .t{border-radius:8px;background:var(--g);display:grid;place-items:center}
.small .t svg{width:100%;height:100%}
.lbl{font-size:10px;color:var(--mut)}
.wm{border-radius:14px;padding:26px 28px;display:flex;align-items:center;gap:14px;margin-bottom:14px;border:1px solid var(--line)}
.wm.light{background:#fff}.wm.dark{background:var(--navy);color:#fff;border-color:var(--navy)}
.wm .mk{width:44px;height:44px;border-radius:11px;background:var(--g);display:grid;place-items:center;flex-shrink:0}
.wm .mk svg{width:30px;height:30px}
.name{font-size:30px;letter-spacing:-1px}
.two b{font-weight:800}.two span{font-weight:300}
.dotless{position:relative;display:inline-block;font-weight:700}
.dotless i{position:absolute;left:.06em;top:.12em;width:.2em;height:.2em;background:var(--g);border-radius:.04em}
.caps{font-weight:700;letter-spacing:.22em;font-size:24px}
.tag{font-size:11px;color:var(--mut);margin-left:auto}
.dark .tag{color:#94A3B8}
</style></head><body><div class="wrap">
<h1>Invmatics — logo concepts</h1>
<p class="sub">Six symbols on the brand green, on navy, and at favicon size. Then three wordmark styles.</p>

<h2>Symbols</h2>
<div class="grid" id="grid"></div>

<h2>Wordmarks (shown with symbol 3, the dot grid)</h2>
<div id="wms"></div>
</div>
<script>
const S = {
 bars:`<rect x="12" y="16" width="40" height="9" rx="4.5" fill="#fff"/><rect x="12" y="30" width="26" height="9" rx="4.5" fill="#fff" opacity=".75"/><rect x="12" y="44" width="33" height="9" rx="4.5" fill="#fff" opacity=".5"/>`,
 cube:`<polygon points="32,10 52,21 32,32 12,21" fill="#fff"/><polygon points="12,24 30,34 30,55 12,45" fill="#fff" opacity=".7"/><polygon points="52,24 34,34 34,55 52,45" fill="#fff" opacity=".45"/>`,
 grid:(()=>{let o='';for(let r=0;r<3;r++)for(let c=0;c<3;c++){const x=16+c*16,y=16+r*16,hi=(r==0&&c==2);o+=`<circle cx="${x}" cy="${y}" r="${hi?6.5:4.5}" fill="#fff" opacity="${hi?1:.55}"/>`}return o})(),
 iblocks:`<rect x="12" y="12" width="40" height="12" rx="3" fill="#fff"/><rect x="24" y="26" width="16" height="12" rx="3" fill="#fff" opacity=".75"/><rect x="12" y="40" width="40" height="12" rx="3" fill="#fff"/>`,
 barcode:`<rect x="14" y="12" width="36" height="7" rx="2" fill="#fff"/><rect x="14" y="45" width="36" height="7" rx="2" fill="#fff"/><rect x="23" y="23" width="3" height="18" fill="#fff"/><rect x="29" y="23" width="6" height="18" fill="#fff"/><rect x="38" y="23" width="3" height="18" fill="#fff"/>`,
 layers:`<polygon points="32,10 54,21 32,32 10,21" fill="#fff"/><path d="M10 31 L32 42 L54 31" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" opacity=".7"/><path d="M10 42 L32 53 L54 42" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" opacity=".45"/>`
};
const items=[
 ['1. Stacked bars','Shelves / stock levels. Very legible when tiny; risk: looks like a menu icon.','bars'],
 ['2. Cube','Goods and warehouse. Instantly understood; also the most common idea.','cube'],
 ['3. Dot grid','Inventory slots + "matrix". One highlighted dot = the item being tracked.','grid'],
 ['4. “I” from blocks','A capital I made of stacked stock blocks. Monogram and meaning in one.','iblocks'],
 ['5. Barcode “I”','Scan lines forming an I. Very literal and instantly “inventory”.','barcode'],
 ['6. Layers','Stock layers / reporting. Clean and techy; close to common “layers” icons.','layers']];
const svg=(k,cls='')=>`<svg viewBox="0 0 64 64" class="${cls}">${S[k]}</svg>`;
document.getElementById('grid').innerHTML=items.map(([t,d,k])=>`
<div class="card"><h3>${t}</h3><p>${d}</p>
<div class="row"><div class="tile">${svg(k)}</div><div class="tile navy">${svg(k).replace(/#fff/g,'#10B981')}</div>
<div class="small"><div class="t" style="width:32px;height:32px">${svg(k)}</div><span class="lbl">32px</span>
<div class="t" style="width:16px;height:16px;border-radius:4px">${svg(k)}</div><span class="lbl">16px favicon</span></div></div></div>`).join('');
const mk=svg('grid');
document.getElementById('wms').innerHTML=`
<div class="wm light"><div class="mk">${mk}</div><div class="name two"><b>inv</b><span>matics</span></div><span class="tag">A · two-tone</span></div>
<div class="wm dark"><div class="mk">${mk}</div><div class="name two"><b>inv</b><span>matics</span></div><span class="tag">A · two-tone</span></div>
<div class="wm light"><div class="mk">${mk}</div><div class="name"><span class="dotless">ı<i></i></span><span style="font-weight:700">nvmatics</span></div><span class="tag">B · square dot on the i</span></div>
<div class="wm dark"><div class="mk">${mk}</div><div class="name"><span class="dotless">ı<i></i></span><span style="font-weight:700">nvmatics</span></div><span class="tag">B · square dot on the i</span></div>
<div class="wm light"><div class="mk">${mk}</div><div class="caps">INVMATICS</div><span class="tag">C · wide caps</span></div>
<div class="wm dark"><div class="mk">${mk}</div><div class="caps">INVMATICS</div><span class="tag">C · wide caps</span></div>`;
</script></body></html>
